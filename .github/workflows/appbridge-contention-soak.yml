name: appbridge contention soak (temporary)

# Temporary evidence for the relay-gate contention fix: runs scripts/appbridge-integration.mts many times
# for the pre-fix broker code ("baseline", the files as of BASELINE_SHA) and this branch ("branch"), side by
# side on the same runner population.
#   sequence: each iteration resets the database and replays the postgres-roundtrip job's steps in order
#             (dispatch, lists, then appbridge), the way the flaky step actually runs;
#   slowdb:   the Postgres container is held to half a CPU, so every transaction is slow;
#   burst:    scripts/appbridge-burst-soak.mts, the largest bursts the caps allow (8 pairs at once).
# Removed before the PR is marked ready.
on:
  push:
    branches: [loby/relay-gate-contention]
    paths: [".github/workflows/appbridge-contention-soak.yml", "apps/broker/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  BASELINE_SHA: 69b799ac587f20a13998f0cb59e1c4ad2fd06c3a
  ITERATIONS: 40

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        code: [branch]
        mode: [sequence, slowdb, burst-slowdb]
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: apps/broker
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dispatch_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dispatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/dispatch_test
      BC_TEST_CODEX_EXE: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/broker/package-lock.json
      - run: npm ci
      - name: Use the pre-fix broker code
        if: matrix.code == 'baseline'
        run: git checkout "$BASELINE_SHA" -- src scripts prisma && git -C ../.. status --short
      - name: Hold Postgres to half a CPU
        if: endsWith(matrix.mode, 'slowdb')
        run: |
          pg=$(docker ps -q --filter ancestor=postgres:16)
          docker update --cpus 0.5 "$pg"
          docker inspect -f 'NanoCpus={{.HostConfig.NanoCpus}}' "$pg"
      - name: Soak
        run: |
          run() { node --experimental-strip-types --import ./route-tests/register-hooks.mjs "scripts/$1" > "$1.out" 2>&1; }
          pass=0; fail=0; other=0
          for i in $(seq "$ITERATIONS"); do
            npx prisma db push --force-reset --skip-generate > /dev/null 2>&1 || { echo "db push failed"; exit 1; }
            if [ "${{ matrix.mode }}" = sequence ]; then
              run dispatch-integration.mts || { other=$((other+1)); echo "dispatch-integration failed (iter $i)"; tail -5 dispatch-integration.mts.out; }
              run lists-integration.mts || { other=$((other+1)); echo "lists-integration failed (iter $i)"; tail -5 lists-integration.mts.out; }
            fi
            start=$(date +%s%N)
            script=appbridge-integration.mts; case "${{ matrix.mode }}" in burst*) script=appbridge-burst-soak.mts;; esac
            if run "$script"; then pass=$((pass+1)); r=PASS; else fail=$((fail+1)); r=FAIL; fi
            ms=$(( ($(date +%s%N) - start) / 1000000 ))
            where=$(grep -o '[a-z-]*.mts:[0-9]*' "$script.out" | head -1)
            actual=$(grep -o 'actual: \[[^]]*\]\|BURST session=.*' "$script.out" | head -1)
            echo "SOAK ${{ matrix.code }} ${{ matrix.mode }} shard=${{ matrix.shard }} iter=$i $r ${ms}ms $where $actual"
            if [ "$r" = FAIL ]; then grep -v '^PASS' "$script.out" | head -20; fi
          done
          echo "SOAK-SUMMARY code=${{ matrix.code }} mode=${{ matrix.mode }} shard=${{ matrix.shard }} pass=$pass fail=$fail other_step_failures=$other"
          echo "code=${{ matrix.code }} mode=${{ matrix.mode }} shard=${{ matrix.shard }}: pass=$pass fail=$fail (other steps failed: $other)" >> "$GITHUB_STEP_SUMMARY"
