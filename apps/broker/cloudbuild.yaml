# Cloud Build config for the Back Channel broker.
#
# Trigger: push to main branch.
# Result: image pushed to gcr.io/$PROJECT_ID/backchannel-broker:${_TAG}
#         AND deployed to Cloud Run service `backchannel-broker` in us-west1.

steps:
  # 1. Build image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/broker/Dockerfile
      - -t
      - gcr.io/$PROJECT_ID/backchannel-broker:${_TAG}
      - -t
      - gcr.io/$PROJECT_ID/backchannel-broker:latest
      - .

  # 2. Push image
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - gcr.io/$PROJECT_ID/backchannel-broker

  # 3. Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - backchannel-broker
      - --image=gcr.io/$PROJECT_ID/backchannel-broker:${_TAG}
      - --region=us-west1
      - --platform=managed
      - --min-instances=1
      - --max-instances=1
      - --memory=1Gi
      - --cpu=1
      - --port=8080
      - --timeout=3600   # WebSocket sessions up to 60 min
      - --session-affinity
      - --allow-unauthenticated
      - --add-cloudsql-instances=$_CLOUDSQL_INSTANCE
      # NOTE: --set-env-vars REPLACES the entire env on every deploy, so EVERY
      # var the service needs must be listed here or it gets dropped. EMAIL_FROM
      # is required — without it the sender falls back to onboarding@resend.dev
      # (Resend test mode, owner-email-only) and real signups fail to deliver.
      # APPBRIDGE_*: Back Channel Remote relay (docs/appbridge-remote-access.md). REMOTE_ACCESS=on is the
      # relay-wide switch (only admin-entitled accounts get passes); RELAY_PUBLIC_KEY is the public half of
      # the Cloudflare relay's Ed25519 signing key (not secret; the private half is a Worker secret).
      # ADMIN_EMAILS: the only account(s) allowed into /admin and the admin APIs (src/lib/admin.ts).
      # Unset = admin closed to everyone. For more than one email, separate them with ';' here, because
      # this list is comma-delimited.
      # STRIPE_REMOTE_PRICE_ID: the Remote tier's recurring Stripe price (not secret), from the
      # _STRIPE_REMOTE_PRICE_ID substitution below. Empty = billing off: the billing routes answer 503.
      - "--set-env-vars=PUBLIC_APP_URL=https://back-channel.app,NODE_ENV=production,EMAIL_FROM=Back Channel <noreply@back-channel.app>,APPBRIDGE_REMOTE_ACCESS=on,APPBRIDGE_RELAY_PUBLIC_KEY=MCowBQYDK2VwAyEAtClOBnMMcWUwQca1P5kz8QkdovbAgl7OxL3old1j2uU=,ADMIN_EMAILS=skyflyt86@gmail.com,STRIPE_REMOTE_PRICE_ID=${_STRIPE_REMOTE_PRICE_ID}"
      # Stripe secrets come from Secret Manager, never from --set-env-vars. Both secrets MUST exist
      # before a deploy with this line (a placeholder value is fine: an invalid key keeps billing off).
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,RESEND_API_KEY=RESEND_API_KEY:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest

images:
  - gcr.io/$PROJECT_ID/backchannel-broker:${_TAG}
  - gcr.io/$PROJECT_ID/backchannel-broker:latest

substitutions:
  _CLOUDSQL_INSTANCE: ""  # set in trigger UI: <project>:us-west1:backchannel-db
  # The Remote tier's Stripe price id (price_...), not a secret. Commit the real id here once it
  # exists so a plain deploy keeps billing on; "" leaves billing off (fail closed).
  # Sandbox (test-mode) price in acct_1UJLYdGf5aFTGoME, $5.00/month. Replace with the live price id
  # together with the live STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET when switching to live mode.
  _STRIPE_REMOTE_PRICE_ID: "price_1UJLhoGf5aFTGoME6oyIleQ1"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s



